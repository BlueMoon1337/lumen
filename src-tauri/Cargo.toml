[package]
name = "lumen"
version = "1.0.1"
description = "Lumen: live presentation software for worship services and events"
edition = "2024"
rust-version = "1.90"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Save panels for File ▸ Export, and the clipboard for Import ▸ Text from Clipboard.
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# macOS: display names from AppKit, the Dock icon, and Edit's Spelling and Transformations menus. Same versions Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSScreen", "objc2-core-foundation"] }

# Linux: lets the web view open cameras (the Video Input layer). Same version wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
